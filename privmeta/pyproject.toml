[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privmeta"
version = "0.1.1"
description = "EXIF and metadata cleaner, faker and shredder for images and documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "tc4dy"}]
dependencies = [
    "click>=8.1",
    "piexif>=1.1.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
audio = ["mutagen>=1.47"]
all = ["pypdf>=4.0", "mutagen>=1.47"]

[project.scripts]
privmeta = "privmeta.cli:main"

[tool.setuptools.packages.find]
include = ["privmeta*"]

[tool.setuptools.package-data]
privmeta = ["profiles/*.json"]
